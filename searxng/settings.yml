# Minimal SearXNG config for gen-api.
# secret_key is injected via the SEARXNG_SECRET environment variable in docker-compose.
use_default_settings: true

general:
  instance_name: "GenXNG"

server:
  limiter: false
  image_proxy: false

search:
  # JSON must be enabled or the API returns 403 for format=json
  formats:
    - html
    - json
  autocomplete: "google"

ui:
  static_use_hash: true

# --- engine-probe: BEGIN (regenerated by scripts/engine_probe.py) ---
# bing web search is disabled in searxng defaults but verified working on
# this network (2026-08-14) and roughly doubles general-category coverage.
# Run scripts/engine_probe.py --apply on the target egress to regenerate
# this section from measured evidence.
engines:
  - name: bing
    disabled: false  # passes proxy (checked 2026-08-14)
# --- engine-probe: END ---
